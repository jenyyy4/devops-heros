# Lean Prometheus (prometheus-community/prometheus chart, server only) for a 2-CPU minikube node.
#   helm upgrade --install prometheus prometheus-community/prometheus -n monitoring \
#     --create-namespace -f monitoring/prometheus-values.yaml
# Why not kube-prometheus-stack? It was tried first: operator + webhooks + node-exporter +
# kube-state-metrics + Grafana sidecars saturated the 2 vCPUs (API server timeouts). This chart
# runs ONE pod (prometheus-server + config-reloader) and discovers targets via annotations.

alertmanager: {enabled: false}
kube-state-metrics: {enabled: false}
prometheus-node-exporter: {enabled: false}
prometheus-pushgateway: {enabled: false}

configmapReload:
  prometheus:
    resources:
      requests: {cpu: 10m, memory: 24Mi}
      limits: {cpu: 100m, memory: 64Mi}   # 50m/32Mi was too tight: probe timeouts

server:
  retention: 6h
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false          # demo: emptyDir is enough for 6h of data
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 512Mi}

# ---- scrape jobs: keep only what the ClinicFlow dashboard needs ----
scrapeConfigs:
  kubernetes-api-servers: {enabled: false}
  kubernetes-nodes: {enabled: false}
  kubernetes-nodes-cadvisor: {enabled: false}      # replaced by the trimmed job below
  kubernetes-service-endpoints: {enabled: false}
  kubernetes-service-endpoints-slow: {enabled: false}
  kubernetes-services: {enabled: false}
  kubernetes-pods-slow: {enabled: false}
  prometheus-pushgateway: {enabled: false}
  # kubernetes-pods (default ON): scrapes every pod annotated prometheus.io/scrape="true"
  #   -> the ClinicFlow backend (/metrics from prometheus-fastapi-instrumentator)
  cadvisor-clinicflow:
    job_name: cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metrics_path: /metrics/cadvisor
    scrape_interval: 30s
    kubernetes_sd_configs:
      - role: node
    metric_relabel_configs:
      # keep only pod CPU / memory series (cAdvisor exposes thousands of others)
      - source_labels: [__name__]
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_spec_memory_limit_bytes
        action: keep
      - source_labels: [container]
        regex: ""
        action: drop

# ---- alerting rules (Prometheus evaluates them; Alertmanager is disabled to save memory,
#      so firing alerts are visible at /api/v1/alerts and in Grafana) ----
serverFiles:
  alerting_rules.yml:
    groups:
      - name: clinicflow.rules
        rules:
          - alert: ClinicFlowBackendDown
            expr: sum(up{job="kubernetes-pods", namespace="clinicflow", app_kubernetes_io_component="backend"}) < 1 or absent(up{job="kubernetes-pods", namespace="clinicflow", app_kubernetes_io_component="backend"})
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: ClinicFlow backend is down
              description: No ClinicFlow backend pod has been successfully scraped for 1 minute.
          - alert: ClinicFlowHighErrorRate
            expr: |
              (sum(rate(http_requests_total{namespace="clinicflow", status="5xx"}[2m])) or vector(0))
                / clamp_min(sum(rate(http_requests_total{namespace="clinicflow"}[2m])), 1e-9) > 0.05
            for: 1m
            labels: {severity: warning}
            annotations:
              summary: ClinicFlow backend 5xx error rate above 5%
              description: "{{ $value | humanizePercentage }} of requests are failing."
          - alert: ClinicFlowHighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="clinicflow"}[5m]))) > 0.5
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: ClinicFlow p95 latency above 500ms
          - alert: ClinicFlowBookingConflictSpike
            expr: sum(increase(clinicflow_booking_conflicts_total{namespace="clinicflow"}[10m])) > 10
            for: 0m
            labels: {severity: info}
            annotations:
              summary: Many double-booking attempts at the front desk
              description: "{{ $value | humanize }} bookings were rejected as double-bookings in 10 minutes (calendar out of sync or a client retry loop?)."
