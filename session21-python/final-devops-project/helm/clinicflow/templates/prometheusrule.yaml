{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "clinicflow.fullname" . }}-alerts
  labels:
    {{- include "clinicflow.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: clinicflow.rules
      rules:
        - alert: ClinicFlowBackendDown
          expr: absent(up{namespace="{{ .Release.Namespace }}", service="{{ .Values.backend.service.name }}"} == 1)
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "ClinicFlow backend is down"
            description: "No healthy backend target has been scraped in {{ .Release.Namespace }} for 1 minute."
        - alert: ClinicFlowHighErrorRate
          expr: |
            (sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status="5xx"}[5m])) or vector(0))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 1e-9)
              > {{ .Values.prometheusRule.errorRateThreshold }}
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "ClinicFlow backend 5xx rate above {{ mulf .Values.prometheusRule.errorRateThreshold 100 }}%"
        - alert: ClinicFlowHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "ClinicFlow p95 latency above 500ms"
        - alert: ClinicFlowBookingConflictSpike
          expr: sum(increase(clinicflow_booking_conflicts_total{namespace="{{ .Release.Namespace }}"}[10m])) > 10
          labels: {severity: info}
          annotations:
            summary: "Many double-booking attempts at the front desk"
{{- end }}
