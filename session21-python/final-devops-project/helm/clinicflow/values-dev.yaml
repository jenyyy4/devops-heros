# Dev: small footprint, fixed 2 replicas (no HPA) so rolling updates stay zero-downtime.
backend:
  replicaCount: 2
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 256Mi}
frontend:
  replicaCount: 2
autoscaling:
  enabled: false
ingress:
  host: clinicflow.local
config:
  logLevel: debug
