# Prod-like: registry images, HA replicas, HPA, TLS ingress, external secret, monitoring on.
backend:
  image:
    repository: ghcr.io/jenyyy4/clinicflow-backend
    tag: "7597c293298bb0891f6983e6896b64c5506ec136"
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
frontend:
  image:
    repository: ghcr.io/jenyyy4/clinicflow-frontend
    tag: "7597c293298bb0891f6983e6896b64c5506ec136"
  replicaCount: 2
postgres:
  auth:
    password: ""                       # never committed for prod
    existingSecret: clinicflow-db-prod  # created by External Secrets / Sealed Secrets
  persistence:
    size: 10Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
ingress:
  host: clinicflow.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    - secretName: clinicflow-tls
      hosts: [clinicflow.example.com]
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
config:
  logLevel: warning
serviceMonitor:
  enabled: true
prometheusRule:
  enabled: true
