# LOCAL GitOps demo (applied): Argo CD tracks a local git repo served by `git daemon`
# from the Mac (see sync-local-repo.sh). Repo layout mirrors this project:
#   helm/clinicflow/                      <- the Helm chart
#   gitops/apps/clinicflow/values-local.yaml  <- environment values (edit + commit to deploy)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clinicflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the App deletes its resources
spec:
  project: clinicflow
  source:
    repoURL: git://host.minikube.internal/clinicflow-gitops
    targetRevision: main
    path: helm/clinicflow
    helm:
      releaseName: clinicflow
      valueFiles:
        - values.yaml
        - ../../gitops/apps/clinicflow/values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: clinicflow
  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true   # revert manual drift (kubectl scale/edit/delete)
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
  revisionHistoryLimit: 10
