# Environment values for the LOCAL minikube GitOps environment.
# Read by gitops/argocd-application.yaml on top of helm/clinicflow/values.yaml.
# GitOps rule: change the cluster by committing to THIS file, never with kubectl.
backend:
  image:
    repository: clinicflow-backend      # built into minikube (minikube image load)
    tag: "1.0.0"                       # CD bumps .backend.image.tag
frontend:
  image:
    repository: clinicflow-frontend
    tag: "1.0.0"                       # CD bumps .frontend.image.tag
  replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
ingress:
  enabled: true
  host: clinicflow.local
config:
  logLevel: info
serviceMonitor:
  enabled: false     # this cluster runs plain Prometheus (annotation scraping), no operator CRDs
