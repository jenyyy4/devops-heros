# AppProject: limits what the ClinicFlow Applications may deploy and where.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: clinicflow
  namespace: argocd
spec:
  description: ClinicFlow capstone (Session 21)
  sourceRepos:
    - git://host.minikube.internal/clinicflow-gitops      # local demo repo (git daemon)
    - https://github.com/jenyyy4/devops-heros.git         # real-world repo
    - https://github.com/jenyyy4/devops-heros
  destinations:
    - server: https://kubernetes.default.svc
      namespace: clinicflow
    - server: https://kubernetes.default.svc
      namespace: clinicflow-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
