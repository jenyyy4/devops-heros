# Shared objects for every scenario. Scenarios run in their OWN namespace (cf-debug) because
# namespace clinicflow is owned by Argo CD (selfHeal would "fix" our breakage before we can debug it).
# They reuse the Argo-managed Postgres in namespace clinicflow over cluster DNS.
apiVersion: v1
kind: Namespace
metadata:
  name: cf-debug
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: cf-debug
data:
  DB_HOST: clinicflow-postgres.clinicflow.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: clinicflow
---
apiVersion: v1
kind: Secret
metadata:
  name: api-db
  namespace: cf-debug
type: Opaque
stringData:
  DB_USER: clinicflow
  DB_PASSWORD: clinicflow-dev-password
---
# toolbox pod used as an in-cluster client (wget/nslookup) during investigations
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: cf-debug
spec:
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 16Mi}
