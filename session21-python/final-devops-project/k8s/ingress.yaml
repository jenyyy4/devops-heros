apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinicflow
  namespace: clinicflow
  labels: {app.kubernetes.io/part-of: clinicflow}
spec:
  ingressClassName: nginx
  rules:
    - host: clinicflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: backend, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 80}}
