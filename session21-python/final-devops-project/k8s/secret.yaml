# Demo credentials only. In a real environment create this Secret out-of-band
# (Sealed Secrets / External Secrets / SOPS) and never commit real passwords.
apiVersion: v1
kind: Secret
metadata:
  name: clinicflow-db
  namespace: clinicflow
  labels:
    app.kubernetes.io/part-of: clinicflow
type: Opaque
stringData:
  DB_USER: clinicflow
  DB_PASSWORD: clinicflow-dev-password
