apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: clinicflow
  labels: {app.kubernetes.io/part-of: clinicflow}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleUp:
      # Python import + Alembic briefly burn CPU when a pod starts; don't scale on that spike.
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60   # demo-friendly (default is 300s)
